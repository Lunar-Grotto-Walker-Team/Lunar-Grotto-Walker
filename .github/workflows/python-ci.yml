name: Python CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, develop]

# 只查"真的会炸"的问题：语法错误 + 未定义名 + 无效比较。
# 规则与排除项统一写在根目录 pyproject.toml 的 [tool.ruff] 里，
# 保证本地 `ruff check .` 与 CI 行为一致。
#
# pytest 目前没有可收集的 Python 测试（测试都在 C++ gtest 里），
# 等出现 Python 测试时取消最后一段注释。

jobs:
  lint:
    name: Syntax and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff

      - name: Compile check
        run: python -m compileall -q src tools

      - name: Ruff
        run: ruff check .

      # - name: Unit tests
      #   run: pip install pytest && pytest -q

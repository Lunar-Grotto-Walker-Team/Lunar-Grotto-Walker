name: Python CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, develop]

# 只查"真的会炸"的问题：语法错误 + 未定义名 + 无效比较。
# 不做格式检查（black/ruff format）—— 本仓库的 launch 文件与工具脚本没有统一
# 格式化基线，格式检查只会制造噪声；等团队定下格式化规范后再单独加一个 job。
#
# pytest 目前没有可收集的 Python 测试（测试都在 C++ gtest 里），
# 等出现 Python 测试时取消最后一段注释。

jobs:
  lint:
    name: Syntax and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff

      - name: Compile check
        run: python -m compileall -q src tools

      - name: Ruff (errors only)
        run: |
          ruff check \
            --select E9,F63,F7,F82 \
            --exclude thirdparty,build,install,log \
            .

      # - name: Unit tests
      #   run: pip install pytest && pytest -q

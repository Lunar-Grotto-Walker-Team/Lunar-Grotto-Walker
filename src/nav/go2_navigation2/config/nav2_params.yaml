amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.4   # 旋转噪声（小角度转向误差）
    alpha2: 0.4   # 旋转噪声（大角度转向误差）
    alpha3: 0.4   # 平移噪声（直线运动误差）
    alpha4: 0.4   # 平移噪声（侧向运动误差，全向模型关键）
    alpha5: 0.3   # 平移时的旋转耦合噪声（保持不变）
    base_frame_id: "base_link"
    beam_skip_distance: 0.5 
    beam_skip_error_threshold: 0.9   
    beam_skip_threshold: 0.3    
    do_beamskip: true             #false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000          #2000
    min_particles: 800          #500
    odom_frame_id: "odom"
    pf_err: 0.08
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 2
    robot_model_type: "nav2_amcl::OmniMotionModel" # 全向模型,DWB 已禁侧移(vy_samples=0);差分模型会让 AMCL 在侧滑/外力推动时定位漂移过大,这里保守用全向
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.2
    update_min_a: 0.3     #0.2
    update_min_d: 0.3     #0.25
    z_hit: 0.5     # 降低有效命中权重（激光噪声多）
    z_max: 0.05
    z_rand: 0.5     # 提高随机噪声权重（容忍更多异常值）
    z_short: 0.05
    scan_topic: scan

